name: nestline_speedway
description: >-
  Nestline Speedway — a tactical racing roguelike where your command deck is the
  genome of the birds you breed. Offline, no ads, no in-app purchases.
publish_to: 'none'

# Bumped to 2.0.0 because the app was rebuilt from the ground up as a racing
# game; nothing but the art and the name carried over from 1.0.0.
version: 2.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  webview_flutter: ^4.14.1
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  image: ^4.9.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # Cut sprites. The source sheets live in tool/sheets/ and are not shipped.
    - assets/gen/chicken/
    - assets/gen/egg/
    - assets/gen/food/
    - assets/gen/care/
    - assets/gen/reward/
    - assets/gen/coop/
    - assets/gen/toy/
    - assets/gen/feather/
    - assets/gen/plant/
    - assets/gen/accessory/
    - assets/gen/misc/
    # Racing plates and scene backdrops.
    - assets/art/
    - assets/art/tracks/
    - assets/sfx/
    - assets/music/
    - assets/web/
    - assets/brand/logo.png

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/FredokaOne-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/brand/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "assets/brand/app_icon.png"
  adaptive_icon_foreground: "assets/gen/misc/transparent.png"
